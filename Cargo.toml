[workspace]
members = ["crates/pebble-core", "crates/pebble-ffi"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
pebble-core = { path = "crates/pebble-core" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.1"
uuid = { version = "1.27", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
uniffi = "=0.32.2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "debuginfo"
