# Shared provider settings belong here. Local demo mode needs no API key.
[defaults]

# Enable a complete connection for live model replies.
# [defaults.chat]
# model = "your-model"
# base_url = "https://your-provider.example/v1"
# api = "chat_completions"
# context_len = 65536
# max_output_tokens = 4096
# api_key = "" # Empty for endpoints without authentication.
# Or use an environment reference instead of a nonempty inline key:
# api_key_env = "PEBBLE_API_KEY"

# Independent lightweight participation model; explicit mentions work without it.
[defaults.classifier]
model = "Qwen/Qwen3.5-2B"
base_url = "http://beluga:4014/v1"
api = "chat_completions"
api_key = ""
context_len = 16384
max_output_tokens = 64

[defaults.classifier.request]
temperature = 0
[defaults.classifier.request.chat_template_kwargs]
enable_thinking = false
