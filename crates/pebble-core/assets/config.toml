# Shared provider settings belong here. Local demo mode needs no API key.
[defaults]

# Enable a complete connection for live model replies.
# [defaults.chat]
# model = "your-model"
# base_url = "https://your-provider.example/v1"
# api = "chat_completions"
# api_key = "" # Empty for endpoints without authentication.
# Or use an environment reference instead of a nonempty inline key:
# api_key_env = "PEBBLE_API_KEY"

# Context/input estimate and output reserve; persona [context] overrides each field.
[defaults.context]
context_window_tokens = 65536
max_output_tokens = 4096
