name: Pebble
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath.git
    exactVersion: 1.7.3
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "16"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
    INFOPLIST_KEY_NSCalendarsUsageDescription: Pebble uses your calendars to answer questions about your schedule and manage events when you ask.
    INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Pebble uses your calendars to answer questions about your schedule and manage events when you ask.
    PRODUCT_BUNDLE_IDENTIFIER: io.github.zydtiger.pebble
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Generated"
    OTHER_SWIFT_FLAGS:
      - "$(inherited)"
      - "-Xcc"
      - "-fmodule-map-file=$(SRCROOT)/Generated/PebbleCoreFFI.modulemap"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "$(SRCROOT)/../target/$(RUST_PROFILE)/libpebble_ffi.a"
      - "-liconv"
  configs:
    Debug:
      RUST_PROFILE: debug
    Release:
      RUST_PROFILE: release
targets:
  Pebble:
    type: application
    platform: macOS
    dependencies:
      - package: SwiftMath
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: Pebble
    sources:
      - path: Pebble
        excludes: ["Resources/Pebble.icon"]
      - path: Pebble/Resources/Pebble.icon
        type: file
        buildPhase: resources
      - path: Generated
        includes: ["*.swift"]
    preBuildScripts:
      - name: Build Rust core and Swift bindings
        script: 'bash "$SRCROOT/../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Pebble:
    build:
      targets:
        Pebble: all
    run:
      config: Debug
